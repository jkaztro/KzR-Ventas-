name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Android SDK y Cordova
        run: |
          sudo apt-get update
          npm install -g cordova

      - name: Preparar proyecto y generar APK
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f icon.png ]; then cp icon.png www/; fi
          
          # Crear proyecto Cordova
          cordova create appcom com.kzr.ventas "KzR Ventas"
          cd appcom
          rm -rf www
          cp -r ../www .
          
          # Agregar plataforma Android e instalar dependencias
          cordova platform add android@12.0.0
          
          # Compilar APK en modo debug
          cordova build android --debug

      - name: Buscar y subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: KzR-Ventas-APK
          path: appcom/platforms/android/app/build/outputs/apk/debug/*.apk
